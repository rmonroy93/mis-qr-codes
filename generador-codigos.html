<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador de Códigos — rmonroy93</title>
  <!-- APP_VERSION: 1.1.1 -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0e0f;
      --surface: #17171a;
      --surface2: #1f1f24;
      --border: #2a2a30;
      --accent: #c8f135;
      --accent-dim: #a0c020;
      --text: #f0f0ee;
      --muted: #888890;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 820px;
      width: 100%;
    }
    h1 {
      font-family: 'DM Mono', monospace;
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      max-width: 200px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      outline: none;
      transition: border .2s;
    }
    .field input:focus {
      border-color: var(--accent);
    }
    .field input[type=number]::-webkit-inner-spin-button,
    .field input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .field input[type=number] {
      -moz-appearance: textfield;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--muted); }
    .output-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .output-label span {
      font-size: .85rem;
      color: var(--muted);
    }
    .output-label .count {
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
    }
    textarea {
      width: 100%;
      height: 420px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .75rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .copy-ok {
      color: var(--accent);
      font-size: .8rem;
      opacity: 0;
      transition: opacity .3s;
    }
    .copy-ok.show { opacity: 1; }
    .example-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      line-height: 1.5;
      margin-top: 16px;
      color: var(--muted);
      word-break: break-all;
    }
    .example-box strong {
      color: var(--text);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Generador de Códigos</h1>
    <div class="badge">v1.1.1</div>

    <div class="field">
      <label for="cantidad">¿Cuántos códigos quieres generar?</label>
      <input type="number" id="cantidad" min="1" max="5000" value="10" />
    </div>

    <div class="actions">
      <button class="btn" id="btn-generar">Generar</button>
      <button class="btn btn-outline" id="btn-copiar">Copiar</button>
      <button class="btn btn-outline" id="btn-limpiar">Limpiar</button>
    </div>

    <div class="output-label">
      <span>Salida <span class="count" id="line-count">(0 líneas)</span></span>
      <span class="copy-ok" id="copy-msg">¡Copiado!</span>
    </div>

    <textarea id="output" placeholder="Aquí aparecerán los códigos generados&#10;Formato: folio (tabulador) sello digital&#10;Listo para copiar y pegar en Excel..." readonly></textarea>

    <div class="example-box">
      <strong>Ejemplo de una línea (tab-separada):</strong><br/>
      278050809249&nbsp;&nbsp;&nbsp;&nbsp;O00viAZYvDhEiu6-ZdNzRrAAsTmKAtJ-LuzQIsKThkw5wEH-829VIruMqlUHxrG-...
    </div>
  </div>

  <script>
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const SEGMENTS = 15;
    const SEGMENT_LEN = 15;

    function randInt(max) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % max;
    }

    function randomFolio() {
      // Primera posición 1-9 (nunca cero), resto 0-9
      let f = '' + (randInt(9) + 1);
      for (let i = 1; i < 12; i++) f += randInt(10);
      return f;
    }

    function randomSello() {
      const segs = [];
      for (let s = 0; s < SEGMENTS; s++) {
        let seg = '';
        for (let c = 0; c < SEGMENT_LEN; c++) seg += CHARS[randInt(CHARS.length)];
        segs.push(seg);
      }
      return segs.join('-');
    }

    function generar() {
      const input = document.getElementById('cantidad');
      const n = Math.min(Math.max(parseInt(input.value) || 1, 1), 5000);
      input.value = n;

      const usados = new Set();
      const lines = [];
      let intentos = 0;
      const maxIntentos = n * 100;

      while (lines.length < n && intentos < maxIntentos) {
        intentos++;
        const folio = randomFolio();
        const sello = randomSello();
        const clave = folio + '\t' + sello;
        if (usados.has(clave)) continue;
        usados.add(clave);
        lines.push(clave);
      }

      const ta = document.getElementById('output');
      ta.value = lines.join('\n');
      document.getElementById('line-count').textContent = '(' + lines.length + ' líneas)';
      document.getElementById('copy-msg').classList.remove('show');
    }

    function copiar() {
      const ta = document.getElementById('output');
      if (!ta.value) return;
      navigator.clipboard.writeText(ta.value).then(() => {
        const msg = document.getElementById('copy-msg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2000);
      });
    }

    function limpiar() {
      document.getElementById('output').value = '';
      document.getElementById('line-count').textContent = '(0 líneas)';
      document.getElementById('copy-msg').classList.remove('show');
    }

    document.getElementById('btn-generar').addEventListener('click', generar);
    document.getElementById('btn-copiar').addEventListener('click', copiar);
    document.getElementById('btn-limpiar').addEventListener('click', limpiar);

    document.getElementById('cantidad').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generar();
    });
  </script>
</body>
</html>
